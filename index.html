<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>On Paper</title>
<meta name="apple-mobile-web-app-title" content="On Paper">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone-width column on a black canvas with an Instagram-style bottom tab bar.
     The loud element is the PR "story ring" gradient; everything else stays quiet greys + one blue. */
  --bg:#000;--s1:#121214;--s2:#1d1d20;--s3:#2c2c31;--line:#222226;
  --tx:#f5f5f7;--tx2:#a3a3ab;--tx3:#6c6c74;
  --accent:#3392f5;--miss:#f25454;--ok:#3ccf82;
  --grad:linear-gradient(135deg,#ffb238 0%,#ff4f6d 52%,#b13dff 100%);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.num,.tab-num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px 16px;min-height:58px}
.top h1{font:800 30px/1 var(--f-display);letter-spacing:.005em}
.top-r{display:flex;align-items:center;gap:6px}
.wordmark{font:800 34px/1 var(--f-display);letter-spacing:-.01em}
.wordmark i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:999px;color:var(--tx)}
.iconbtn:active{background:var(--s2)}
.iconbtn svg{width:24px;height:24px}
.iconbtn.sm{width:34px;height:34px}
.iconbtn.sm svg{width:20px;height:20px}
#banner:empty{display:none}
.banner{margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:var(--s2);color:var(--tx2);font-size:13px}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 16px calc(150px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;outline:none;display:flex;flex-direction:column;gap:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab{height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font:600 10px/1 var(--f-body);letter-spacing:.02em;text-align:center}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--tx)}
.tab[aria-current="page"] svg{stroke-width:2.3}

/* surfaces */
.card{background:var(--s1);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flush{padding:4px 16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-t{font:700 17px/1.2 var(--f-body)}
.eyebrow{font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.muted{color:var(--tx2)}.faint{color:var(--tx3)}.small{font-size:13px}.tiny{font-size:11px}
.grow{flex:1;min-width:0}
.big{font:700 46px/.92 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.005em}
.big.md{font-size:34px}
.big .unit,.unit{font:600 15px/1 var(--f-body);color:var(--tx2);margin-left:4px;letter-spacing:0}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:12px;color:var(--tx3);font-weight:600}
.stat .v{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;min-height:52px}
.row:last-child{border-bottom:0}
button.row:active{opacity:.7}
.row b{font-weight:650}
.rnum{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.empty{padding:22px 4px;text-align:center;color:var(--tx2);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:650;font-size:16px;white-space:nowrap;text-align:center}
.btn:active{filter:brightness(.88)}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.danger-fill{background:var(--miss)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow.three{grid-template-columns:repeat(3,1fr)}
.linkbtn{color:var(--accent);font-weight:600;font-size:15px;padding:6px 0}
.linkbtn.danger{color:var(--miss)}
.center{align-self:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--s2);color:var(--tx);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
.chip[aria-pressed="true"]{background:var(--tx);color:#000}
.chip[aria-pressed="true"] .faint{color:#555}
.chip.eq{font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--tx2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--tx)}
.lbl{font-size:13px;font-weight:600;color:var(--tx2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields.three{grid-template-columns:repeat(3,1fr)}
.fields.four{grid-template-columns:repeat(4,1fr)}
input,select,textarea{font:inherit;font-size:17px;color:var(--tx);background:var(--s2);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-height:46px;outline:none;-webkit-appearance:none;appearance:none;display:block}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--tx3)}
input[type=date],input[type=time]{text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input.huge{font:700 44px/1 var(--f-display);min-height:70px;text-align:center}
textarea{min-height:90px;resize:vertical}
.ta{font:13px/1.4 ui-monospace,Menlo,monospace;min-height:220px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.tip-line{font-size:13px;color:var(--tx2);background:var(--s2);border-radius:12px;padding:10px 12px}

/* badges + rings */
.pr{display:inline-block;background:var(--grad);color:#fff;font:800 11px/1 var(--f-body);letter-spacing:.04em;padding:4px 7px;border-radius:6px;vertical-align:2px}
.missb{display:inline-block;color:var(--miss);border:1px solid var(--miss);font:700 11px/1 var(--f-body);padding:3px 6px;border-radius:6px;vertical-align:2px}
.baseb{display:inline-block;color:var(--tx2);border:1px solid var(--s3);font:700 11px/1 var(--f-body);padding:3px 6px;border-radius:6px;vertical-align:2px}
.ring{flex:none;width:50px;height:50px;border-radius:50%;padding:2.5px;background:var(--s3)}
.ring.is-pr{background:var(--grad)}
.ring.is-miss{background:var(--miss)}
.ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg);border:2.5px solid var(--bg);font:800 16px/1 var(--f-display);letter-spacing:.02em;background-clip:padding-box;color:var(--tx)}
.ring span{background:var(--s2)}

/* home */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s1);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:132px;text-align:left}
.tile:active{background:var(--s2)}
.tile .k{font-size:13px;font-weight:650;color:var(--tx2)}
.tile .sub{font-size:12px;color:var(--tx3);margin-top:auto}
.spark{display:block;overflow:visible}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark circle{fill:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar.p i{background:var(--tx)}
.bar.over i{background:var(--ok)}
.weekdots{display:flex;gap:5px}
.weekdots i{flex:1;height:22px;border-radius:6px;background:var(--s3);display:grid;place-items:center;font:700 9px/1 var(--f-body);font-style:normal;color:var(--tx3)}
.weekdots i.on{background:var(--accent);color:#fff}
.weekdots i.today{box-shadow:inset 0 0 0 1.5px var(--tx)}
.nudge{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:var(--r);padding:12px 14px;border:1px solid var(--s3)}
.nudge p{flex:1;font-size:14px}
.next h2{font:800 40px/.95 var(--f-display)}
.checklist{display:flex;flex-direction:column}
.checklist .row .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--s3);flex:none;display:grid;place-items:center}
.checklist .row.done .dot{background:var(--ok);border-color:var(--ok)}
.checklist .row.done .dot::after{content:"";width:8px;height:4px;border-left:2px solid #000;border-bottom:2px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
.checklist .row.done b{color:var(--tx2);text-decoration:line-through}

/* charts */
.chart{position:relative;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--tx3);font:11px var(--f-body);font-variant-numeric:tabular-nums}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .xh{stroke:var(--tx3);stroke-width:1;stroke-dasharray:3 3}
.chart .xm{fill:var(--tx);stroke:var(--s1);stroke-width:2}
.chart .tip{position:absolute;top:-6px;transform:translateY(-100%);background:var(--s3);color:var(--tx);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:9px;pointer-events:none;white-space:nowrap;z-index:2;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.chart-empty{height:100%;display:grid;place-items:center;color:var(--tx3);font-size:13px;border:1px dashed var(--s3);border-radius:12px;text-align:center;padding:0 16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.legend i.l{width:14px;height:2.5px;border-radius:2px}

/* train */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{font-size:11px;font-weight:700;color:var(--tx3);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:10px;background:var(--s2);font:600 13px/1 var(--f-body);color:var(--tx2);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.cal button.gym{background:var(--accent);color:#fff}
.cal button.today{box-shadow:inset 0 0 0 2px var(--tx)}
.cal button.fut{opacity:.35}
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-top{display:flex;justify-content:space-between;align-items:flex-end}
.split{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.split li{display:flex;gap:12px;align-items:flex-start}
.split .n,.sets .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--s2);display:grid;place-items:center;font:700 13px/1 var(--f-body);color:var(--tx2)}
.plan{display:flex;flex-direction:column}
.plan .row{padding:9px 0;min-height:0}
.plan s{color:var(--tx3)}
.radio{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--s3)}
.radio[aria-pressed="true"]{border:7px solid var(--accent)}
.exb{background:var(--s1);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.exb-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exb-h h3{font:700 18px/1.2 var(--f-body)}
.sets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.setrow{display:flex;align-items:center;gap:10px;width:100%;padding:6px 0}
.setrow .v{font-variant-numeric:tabular-nums;font-weight:600}
.addset{display:grid;grid-template-columns:1fr auto 1fr auto auto;gap:8px;align-items:center}
.addset input{text-align:center;padding:8px 6px}
.addset .x{color:var(--tx3);font-weight:700}
.missbtn{min-height:46px;padding:0 10px;border-radius:12px;background:var(--s2);color:var(--tx3);font-size:13px;font-weight:650}
.missbtn[aria-pressed="true"]{background:var(--miss);color:#fff}
.exlist{display:flex;flex-direction:column}
.exlist .grp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding:14px 0 2px}
.dayrow{display:flex;align-items:center;gap:6px}
.reorder{display:flex;gap:2px}

.addset2{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;background:var(--s2);border-radius:12px;overflow:hidden;min-height:48px}
.stepper button{font-size:22px;font-weight:500;color:var(--tx2);text-align:center}
.stepper button:active{background:var(--s3);color:var(--tx)}
.stepper input{background:transparent;text-align:center;padding:8px 0;border-radius:0;font-weight:650;min-width:0}
.addset-b{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
.addset-b .btn{min-height:46px}
.exb.done{opacity:.72}
.exb.done:focus-within{opacity:1}
.tgt-edit{display:inline-flex;align-items:center;gap:3px;color:var(--tx3);font-size:13px}
.tgt-edit input{width:46px;min-height:34px;padding:4px;text-align:center;font-size:15px;border-radius:8px}
.tgt-edit input[data-f="reps"]{width:58px}
.toast{display:flex;align-items:center;gap:12px}
.toast-undo{color:var(--accent);font-weight:800;padding:2px 4px}
.btn:active,.chip:active,.tile:active,.row:active{transform:scale(.985)}
.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--s2);font-size:16px}
/* rest timer */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;background:var(--s2);border:1px solid var(--s3);border-radius:999px;padding:6px 6px 6px 8px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#rest[hidden]{display:none}
#rest .rt{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
#rest .rb{min-height:36px;padding:0 10px;border-radius:999px;background:var(--s3);font-size:13px;font-weight:700}
#rest svg{width:30px;height:30px;transform:rotate(-90deg)}
#rest circle{fill:none;stroke-width:4}
#flash{position:fixed;inset:0;z-index:60;pointer-events:none;background:var(--accent);opacity:0}
#flash.go{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{opacity:.55}20%,60%{opacity:.15}100%{opacity:0}}

/* lifts */
.lift-h{font:800 40px/.95 var(--f-display)}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;padding:4px 0;align-self:flex-start}
.repmax{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.repmax div{background:var(--s2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px}
.repmax .k{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.04em}
.repmax .v{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--tx2);background:var(--s2);border-radius:10px;padding:8px 10px;margin-top:6px;line-height:1.4}

/* body */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mgrid button{background:var(--s2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid transparent}
.mgrid button[aria-pressed="true"]{border-color:var(--accent)}
.mgrid .k{font-size:12px;color:var(--tx3);font-weight:650}
.mgrid .v{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -16px}
.photos button{aspect-ratio:3/4;background:var(--s2);overflow:hidden;position:relative}
.photos img,.cmp img{width:100%;height:100%;object-fit:cover;display:block}
.photos .cap{position:absolute;left:6px;bottom:6px;font:700 11px/1 var(--f-body);background:rgba(0,0,0,.6);padding:3px 6px;border-radius:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cmp .ph{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--s2);display:grid;place-items:center;color:var(--tx3);font-size:12px;text-align:center;padding:4px}
.cmp figcaption{font-size:12px;color:var(--tx2);text-align:center}
.viewer img{width:100%;border-radius:12px;display:block}
.prev-img{max-height:220px;width:auto;max-width:100%;border-radius:12px;align-self:center;display:block}

/* food */
.daynav{display:flex;align-items:center;justify-content:space-between}
.daynav b{font-size:16px}
.macro{display:flex;flex-direction:column;gap:6px}
.macro .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.macro .t b{font-variant-numeric:tabular-nums}
.thinking{display:flex;align-items:center;gap:10px;color:var(--tx2)}
.thinking::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--s3);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* layers */
.layer{position:fixed;inset:0;z-index:50}
.layer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .2s}
#sheet.open .scrim,#dialog .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;display:flex;flex-direction:column;background:#17171a;border-radius:20px 20px 0 0;border-top:1px solid var(--s3);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
#sheet.open .panel{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 2px 18px;flex:none}
.sheet-h h2{font:700 18px/1.2 var(--f-body)}
.sheet-b{overflow-y:auto;padding:8px 18px 24px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
#dialog{z-index:70;display:grid;place-items:center}
#dialog[hidden]{display:none}
.dlg{position:relative;width:min(340px,calc(100% - 40px));background:#1f1f23;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--s3)}
.dlg p{font-size:16px;line-height:1.4}
.dlg-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-140%);z-index:80;background:var(--s3);color:var(--tx);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.6);text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.pr{background:var(--grad);color:#fff}
.toast.bad{background:var(--miss);color:#fff}
.loading{padding:60px 0;display:grid;place-items:center;color:var(--tx3);gap:12px}
.loading .thinking{color:var(--tx3)}

/* raccoon buddy */
.raccoon{display:block;overflow:visible}
.raccoon .rc-head{transform-origin:100px 140px;animation:rc-bob 3.2s ease-in-out infinite}
.raccoon .rc-tail{transform-origin:140px 160px;animation:rc-wag 1.6s ease-in-out infinite}
.rc-eating .rc-head{animation:rc-munch .32s ease-in-out infinite}
.rc-hungry .rc-head{animation:rc-sad 3.6s ease-in-out infinite}
.rc-pet{animation:rc-jump .5s ease-out}
@keyframes rc-bob{50%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes rc-wag{50%{transform:rotate(9deg)}}
@keyframes rc-munch{50%{transform:translateY(3px) scale(1.02,.97)}}
@keyframes rc-sad{50%{transform:rotate(3deg) translateY(2px)}}
@keyframes rc-jump{30%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0) scale(1,.94)}}
#buddy-pop{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:rgba(0,0,0,.55);animation:fade .2s}
#buddy-pop[hidden]{display:none}
.bp-card{position:relative;background:#1f1f23;border:1px solid var(--s3);border-radius:28px;padding:22px 26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(300px,calc(100% - 48px));animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.bp-msg{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.bp-msg span{font-size:17px;font-weight:600;line-height:1.35}
.bp-hearts{position:absolute;top:30px;left:0;right:0;height:0;opacity:0}
#buddy-pop.done .bp-hearts{opacity:1}
.bp-hearts i{position:absolute;font-style:normal;color:#ff6b8a;font-size:22px;animation:heart 1.6s ease-out forwards}
.bp-hearts i:nth-child(1){left:28%;animation-delay:0s}.bp-hearts i:nth-child(2){left:50%;animation-delay:.2s;font-size:28px}.bp-hearts i:nth-child(3){left:68%;animation-delay:.4s}
@keyframes heart{0%{transform:translateY(40px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-30px) scale(1.1);opacity:0}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes fade{0%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (min-width:600px){
  .photos{margin:0}
}
</style>
</head>

  <header class="top" id="top"></header>
